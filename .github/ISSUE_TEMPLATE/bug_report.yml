name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Do not include tokens, captured logs, private hostnames, IP addresses or personal paths. Report security problems as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran and their exit codes.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: true
